<title>Page not found: Turnout</title>

<meta name="color-scheme" content="light dark">
<!-- Cloudflare Pages answers every address it has no file for with this page
     and a 404, at that address, so it links from the root and loads nothing
     but itself. Its colours are assets/site.css's. -->
<style>
:root { color-scheme: light dark; --bg: #f5f7fa; --ink: #263140; --muted: #4c596b; --blue: #1f5fbf; }
@media (prefers-color-scheme: dark) { :root { --bg: #121920; --ink: #e6ebf1; --muted: #a5b1c0; --blue: #6fa3f2; } }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang TC", "Hiragino Sans", sans-serif; }
main { max-width: 38rem; margin: 0 auto; padding: 18vh 16px 4rem; }
h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 0.5rem; }
p { margin: 0 0 1rem; color: var(--muted); }
a { color: var(--blue); }
ul { list-style: none; padding: 0; margin: 1.5rem 0 0; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
</style>
</head>
<body>
<main>
  <h1>This page is not here</h1>
  <p>The address may be mistyped, or the page has moved. Everything about Turnout starts on its home page.</p>

</main>
</body>
</html>
