<svg xmlns="http://www.w3.org/2000/svg" width="572" height="627" viewBox="229 265 572 627">
  <!-- The app icon's route map without the plate, for use next to the wordmark. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A586D"/>
      <stop offset="1" stop-color="#2F3A48"/>
    </linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070B"/>
      <stop offset="1" stop-color="#18222D"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="640" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#fade)"/>
    </mask>
  </defs>
  <path d="M239 660 V480 A184 184 0 0 1 607 480 V660 Z" fill="url(#frame)"/>
  <path d="M277 660 V480 A146 146 0 0 1 569 480 V660 Z" fill="url(#bore)"/>
  <path d="M395 830 V420" fill="none" stroke="#2F6FD6" stroke-width="68" mask="url(#fadeMask)"/>
  <path d="M500 830 H658 L736 752 V340" fill="none" stroke="#E07A22" stroke-width="68" stroke-linejoin="round"/>
  <circle cx="736" cy="330" r="46" fill="#fff" stroke="#263140" stroke-width="18"/>
  <rect x="340" y="787" width="214" height="86" rx="43" fill="#fff" stroke="#263140" stroke-width="18"/>
</svg>
